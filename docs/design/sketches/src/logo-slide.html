<!doctype html>
<html><head><meta charset="utf-8">
<title>Logo slide</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="marks.js"></script><script src="gesture.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1920px; height: 1080px; background: #FFF7EC; font-family: Inter, sans-serif; color: #2A1F17; position: relative; overflow: hidden; }
  .bg { position: absolute; inset: 0; }
  .eyebrow { position: absolute; top: 56px; left: 72px; font: 700 15px Inter; letter-spacing: .14em; text-transform: uppercase; color: #8a5a10; }
  .title { position: absolute; top: 82px; left: 72px; font: 800 30px Nunito; }
  .stage { position: absolute; left: 0; right: 0; top: 150px; height: 560px; display: flex; align-items: center; justify-content: center; gap: 30px; }
  .word { font: 900 150px Nunito, sans-serif; letter-spacing: -0.035em; line-height: 1; }
  .be, .loc { color: #2A1F17; } .like { color: #E08A12; }
  .row { position: absolute; left: 72px; right: 72px; bottom: 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .tile { height: 220px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; box-shadow: 0 6px 24px rgba(60,40,20,.10); }
  .tile .cap { position: absolute; left: 18px; bottom: 14px; font-size: 13px; font-weight: 600; opacity: .7; }
  .tile.light { background: #fff; } .tile.dark { background: #2A1F17; color: #FFF7EC; } .tile.honey { background: #F4A62A; }
  .tile.dark .be, .tile.dark .loc { color: #FFF7EC; } .tile.dark .like { color: #F4A62A; }
  .tile .word { font-size: 46px; }
  .ic { border-radius: 23%; display: grid; place-items: center; position: relative; overflow: hidden; background: #2A1F17; }
</style></head>
<body>
<svg class="bg" id="bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
<div class="eyebrow">BeLikeLocal · brand</div>
<div class="title" id="title"></div>
<div class="stage" id="stage"></div>
<div class="row" id="row"></div>
<script>
const inline = location.hash.startsWith('#inline')
// #inline-tilt: the hand turned ~10° clockwise, no crease on the thumb.
const tilt = location.hash === '#inline-tilt'
if (tilt) {
  const g0 = gesture, s0 = svg
  gesture = (o = {}) => g0({ rot: 10, thumbLine: false, ...o })
  svg = (inner, size, vb) => s0(inner, size, vb || '-5 -5 110 110')
}
const W = (s) => `<span class="word" style="font-size:${s}px"><span class="be">Be</span><span class="like">Like</span><span class="loc">Local</span></span>`
const I = (s, dark = false) => `<span class="word" style="font-size:${s}px"><span class="be">Be</span></span><span style="display:block;margin:0 -0.18em 0 -0.12em;font-size:${s}px">${svg(gesture(dark ? D : { sw: 4.2 }), s * 1.45)}</span><span class="word" style="font-size:${s}px"><span class="loc">Local</span></span>`
const D = { ink: '#FFF7EC', skin: '#F4A62A', beeWing: '#2A1F17', sw: 4.2 }

// honeycomb, strongest behind the mark
document.getElementById('bg').innerHTML = `<g transform="translate(${inline ? 410 : 160} 120)">${honeySketch(inline ? 1100 : 1000, 640, 52, { color: '#E2AE5C', opacity: 0.85, seed: 5 })}</g>`

document.getElementById('title').innerHTML = inline
  ? `Inline logo — “Be <span style="display:inline-block;vertical-align:-8px">${svg(gesture({ sw: 6, withBee: false }), 34)}</span> Local”`
  : 'Primary logo'
if (inline) document.getElementById('stage').style.gap = '0'
document.getElementById('stage').innerHTML = inline
  ? `<span class="word"><span class="be">Be</span></span><span style="display:block;transform:translateY(-26px);margin:0 -18px 0 -10px">${svg(gesture({ sw: 3.8 }), 240)}</span><span class="word"><span class="loc">Local</span></span>`
  : `${svg(gesture({ sw: 3.6 }), 330)}${W(150)}`

const icon = (s) => `<div class="ic" style="width:${s}px;height:${s}px">${s >= 40 ? `<span style="position:absolute;inset:0">${svg(honeySketch(100, 100, 16, { color: '#F4A62A', opacity: 0.45, seed: 7 }), s)}</span>` : ''}<span style="position:relative">${svg(gesture({ ...D, withBee: s >= 40, sw: s < 40 ? 6.5 : 4.2 }), s * 0.86)}</span></div>`
const mono = `<span style="display:flex;align-items:center;gap:6px">${inline ? `<span class="word" style="font-size:46px">Be</span>${svg(gesture({ skin: '#fff', beeWing: '#fff', sw: 4.6 }).replaceAll('#F4A62A', '#fff'), 66)}<span class="word" style="font-size:46px">Local</span>` : `${svg(gesture({ skin: '#fff', beeWing: '#fff', sw: 4.6 }).replaceAll('#F4A62A', '#fff'), 78)}<span class="word" style="font-size:46px">BeLikeLocal</span>`}</span>`
document.getElementById('row').innerHTML = `
  <div class="tile dark">${inline ? I(46, true) : `${svg(gesture(D), 78)}${W(46)}`}<span class="cap">On dark</span></div>
  <div class="tile light">${mono}<span class="cap">One colour</span></div>
  <div class="tile honey"><div style="display:flex;align-items:end;gap:16px">${icon(120)}${icon(64)}${icon(32)}${icon(20)}</div><span class="cap">App icon · 120 / 64 / 32 / 20</span></div>
  <div class="tile light" style="flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:6px;background:#FFF7EC;padding:10px 16px;border-radius:12px">${inline ? I(26) : `${svg(gesture({ sw: 5.5 }), 38)}${W(26)}`}</div>
    <span class="cap">Header · ${inline ? 'small screens' : 'desktop'}</span></div>`
</script>
</body></html>

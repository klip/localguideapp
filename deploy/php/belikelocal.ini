; PHP settings for every BeLikeLocal service container (mounted over the
; image's conf.d by docker-lemp's compose file). Errors are logged, never
; printed: a warning in a response body would break the JSON the gateway
; expects. lib/Log.php turns them into structured lines on stderr.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2
memory_limit = 256M
; The services take requests up to the gateway's 4 MB message cap (a photo).
post_max_size = 8M
